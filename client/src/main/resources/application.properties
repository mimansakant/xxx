server.port=${BANK_CLIENT_PORT:8081}
server.address=${BANK_CLIENT_ADDRESS:127.0.0.1}
spring.datasource.url=${BANK_CLIENT_DATABASE_URL:jdbc:h2:file:./data/bank-client;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${BANK_CLIENT_DATABASE_USERNAME:sa}
spring.datasource.password=${BANK_CLIENT_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
bank.service.base-url=${BANK_SERVICE_BASE_URL:http://localhost:8080}
bank.service.api-key=${BANK_SERVICE_API_KEY:}
bank.service.client-id=${BANK_SERVICE_CLIENT_ID:}
bank.client.demo-seed.enabled=${BANK_CLIENT_DEMO_SEED_ENABLED:true}
